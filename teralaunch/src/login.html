<section class="login-form-container-wrapper">
    <div class="login-form-container">
      <div class="tera-logo-1-wrapper">
        <img
          class="tera-logo-1-icon"
          loading="lazy"
          alt=""
          src="./assets/tera-logo@2x.png"
        />
      </div>

      <!-- LOGIN FORM -->
      <form class="login-form" id="login-form-panel">
        <div class="login-wrapper">
          <span class="login1" data-translate="LOGIN_TITLE">Login</span>
        </div>
        <div class="input-fields-wrapper">
          <div class="input-fields">
            <input class="input-text" id="username" name="username" data-translate-placeholder="USERNAME_PLACEHOLDER" placeholder="Username" type="text" />
            <input class="input-text1" id="password" name="password" data-translate-placeholder="PASSWORD_PLACEHOLDER" placeholder="Password" type="text" />
          </div>
        </div>
        <div class="login-error-msg" id="login-error-msg" style="display: none; opacity: 0; transform: translateY(-20px);">
          Invalid Password
        </div>
        <div class="btn-wrapper">
          <button class="btn" id="login-button" type="button">
            <a class="login2" data-translate="LOGIN_BUTTON">LOGIN</a>
          </button>
        </div>
        <div class="register-link-wrapper">
          <span class="register-link-text" data-translate="NO_ACCOUNT_TEXT">Don't have an account?</span>
          <a class="register-link" id="show-register-btn" data-translate="REGISTER_LINK">Create one</a>
        </div>
      </form>

      <!-- REGISTER FORM -->
      <form class="login-form" id="register-form-panel" style="display: none;">
        <div class="login-wrapper">
          <span class="login1" data-translate="REGISTER_TITLE">Register</span>
        </div>
        <div class="input-fields-wrapper">
          <div class="input-fields">
            <input class="input-text" id="reg-username" name="reg-username" data-translate-placeholder="USERNAME_PLACEHOLDER" placeholder="Username" type="text" autocomplete="off" />
            <input class="input-text" id="reg-email" name="reg-email" data-translate-placeholder="EMAIL_PLACEHOLDER" placeholder="Email" type="email" autocomplete="off" />
            <input class="input-text" id="reg-password" name="reg-password" data-translate-placeholder="PASSWORD_PLACEHOLDER" placeholder="Password" type="password" autocomplete="off" />
            <input class="input-text" id="reg-confirm-password" name="reg-confirm-password" data-translate-placeholder="CONFIRM_PASSWORD_PLACEHOLDER" placeholder="Confirm Password" type="password" autocomplete="off" />
          </div>
        </div>
        <div class="login-error-msg" id="register-error-msg" style="display: none; opacity: 0; transform: translateY(-20px);">
          Error
        </div>
        <div class="login-error-msg register-success-msg" id="register-success-msg" style="display: none; opacity: 0; transform: translateY(-20px);">
          Account created!
        </div>
        <div class="btn-wrapper">
          <button class="btn" id="register-button" type="button">
            <a class="login2" data-translate="REGISTER_BUTTON">REGISTER</a>
          </button>
        </div>
        <div class="register-link-wrapper">
          <span class="register-link-text" data-translate="HAVE_ACCOUNT_TEXT">Already have an account?</span>
          <a class="register-link" id="show-login-btn" data-translate="LOGIN_LINK">Sign in</a>
        </div>
      </form>

    </div>
  </section>
  <style>
    .login-error-msg {
      color: #ff3e3e;
      text-align: center;
      margin-bottom: 10px;
      font-weight: bold;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
  </style>
