# =====================================================================
# DXVK configuration - TERA Online (UE3, x86, RTX 3070, Ryzen 7 5700G)
# =====================================================================
# DXVK docs: https://github.com/doitsujin/dxvk/blob/master/dxvk.conf

# --- HUD: FPS counter + frametime grafico + Vulkan version ---
# Mostrar al iniciar para confirmar que DXVK esta activo.
# Cuando confirmes que funciona, cambiar a "0" para ocultar el overlay.
dxvk.hud = fps,frametimes,version,api

# --- Logging: silenciar mensajes en consola ---
dxvk.logLevel = none

# --- Memoria del proceso (CRITICO en TERA 32-bit con LAA) ---
# Limitar el "shared memory" que DXVK reserva en el espacio de 32-bit del proceso.
# Valor bajo = mas RAM virtual disponible para TERA = menos crashes de "out of memory".
# Cargas reales viven en la GPU, no en el proceso.
d3d9.maxFrameLatency = 1
dxgi.maxFrameLatency = 1

# Reservar menos memoria virtual para shared resources (proceso 32-bit)
d3d9.memoryTrackTest = False
# Default 0 = sin limite. En 32-bit conviene limitar a 256MB para evitar pressure.
# Ajustar entre 256-512 segun zonas. Mas bajo = mas estable / mas alto = menos texture pop.
d3d9.maxAvailableMemory = 512

# --- Reducir stutter de compilacion de shaders ---
# Compilar shaders en paralelo usando todos los cores del Ryzen 5700G.
# 0 = automatico (recomendado para Ryzen 8 cores)
dxvk.numCompilerThreads = 0

# Cache de shaders persistente entre sesiones (menos stutter despues de la primera partida)
dxvk.enableStateCache = True

# --- Async shader compilation: evita stutter al ver efectos nuevos ---
# (DXVK 2.x lo maneja internamente — no requiere flag)

# --- VSync OFF a nivel DXVK (ya esta off en TERA ini, doble seguro) ---
dxgi.syncInterval = 0
d3d9.presentInterval = 0

# --- Forzar floating point compatibility con UE3 (evita artifacts de luces) ---
d3d9.floatEmulation = Auto

# --- Texture filtering: usar el del juego (no forzar nada) ---
# (No tocamos d3d9.samplerAnisotropy — TERA lo controla con MaxAnisotropy=16 en INI)

# --- Permitir uso de toda la VRAM disponible (RTX 3070 tiene 8GB) ---
dxgi.maxDeviceMemory = 0
dxgi.maxSharedMemory = 0

# --- NVIDIA Reflex equivalent: low latency mode ---
d3d9.deferSurfaceCreation = True
